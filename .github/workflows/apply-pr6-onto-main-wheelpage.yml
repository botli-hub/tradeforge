name: apply-pr6-onto-main-wheelpage
on:
  push:
    branches: [feat/call-timing-onto-main]
    paths:
      - frontend/patches/pr6-onto-main-wheelpage.patch
      - .github/workflows/apply-pr6-onto-main-wheelpage.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/call-timing-onto-main
      - name: Apply WheelPage patch
        run: |
          set -e
          patch -p1 < frontend/patches/pr6-onto-main-wheelpage.patch
          grep -q HoldingCcBanner frontend/src/pages/WheelPage.tsx
          grep -q TargetSellAbove frontend/src/pages/WheelPage.tsx
          grep -q TargetStanceSelect frontend/src/pages/WheelPage.tsx
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/WheelPage.tsx
          if git diff --staged --quiet; then
            echo "WheelPage already patched"
          else
            git commit -m "feat(wheel): WheelPage 立场+愿卖价列 + P1 去重 Call"
            git push
          fi
